# Throughput settings for the `build` box (i7-3770, Ivy Bridge). See intel/docs/BUILD-BOX-TUNING.md.
# Install: sudo install -m644 intel/grub/90-build-perf.cfg /etc/default/grub.d/ && sudo update-grub
# Remove:  sudo rm /etc/default/grub.d/90-build-perf.cfg && sudo update-grub
# mitigations=off turns off Spectre/Meltdown/MDS protection: only for a machine that runs no untrusted code.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=off init_on_alloc=0 preempt=voluntary cpufreq.default_governor=performance"
